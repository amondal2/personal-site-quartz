# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: From Agastya
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: agastyamondal.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Libre Baskerville
      body: Newsreader
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F7F4EC"
        lightgray: "#E3DED2"
        gray: "#756F64"
        darkgray: "#4A4842"
        dark: "#35342F"
        secondary: "#6B3A3A"
        tertiary: "#8A5A5A"
        highlight: "#EDE5D7"
        textHighlight: "#E6D9C488"
      darkMode:
        light: "#252522"
        lightgray: "#393934"
        gray: "#A9A59A"
        darkgray: "#D7D3C8"
        dark: "#E8E4DA"
        secondary: "#C28C8C"
        tertiary: "#D1A3A3"
        highlight: "#3A342E"
        textHighlight: "#51463A88"

plugins:
  # Content processing
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: true
    order: 10


  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 20


  - source: "github:quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 40

  - source: "github:quartz-community/description"
    enabled: true
    order: 50

  - source: "github:quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 60

  # Page types
  - source: "github:quartz-community/content-page"
    enabled: true

  - source: "github:quartz-community/folder-page"
    enabled: true

  - source: "github:quartz-community/tag-page"
    enabled: true

  - source: "github:quartz-community/canvas-page"
    enabled: true

  # Layout components - keep minimal
  - source: "github:quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index

  - source: "github:quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index

  # Essential utilities
  - source: "github:quartz-community/favicon"
    enabled: true

  - source: "github:quartz-community/og-image"
    enabled: true

  - source: "github:quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "github:quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true   # you likely don't want the properties panel on a minimal blog
    order: 0


# Simple layout - no sidebar, no toolbar
layout:
  byPageType:
    content:
      positions:
        left: []
        right: []
    folder:
      positions:
        left: []
        right: []
    tag:
      positions:
        left: []
        right: []
    "404":
      positions:
        left: []
        right: []
  canvas: {}
  bases: {}